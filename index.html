<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bbf7d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GradeUp">
<title>GradeUp</title>
<style>
:root{--bg:#f3faf5;--card:#fff;--tx:#12231a;--mut:#5b7064;--ac:#15803d;--acl:#bbf7d0;--bd:#d9e8de;--bad:#c62828;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1612;--card:#16211b;--tx:#e6f2ea;--mut:#8fa598;--ac:#4ade80;--acl:#14532d;--bd:#26372c;--bad:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:29px;margin:0;letter-spacing:-.6px}
h2{font-size:18px;margin:24px 0 10px}
.sub{color:var(--mut);margin:5px 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.cls{cursor:pointer;transition:border-color .15s,transform .15s}
.cls:hover{border-color:var(--ac)}
.cls:active{transform:scale(.995)}
.big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--acl);color:var(--ac);font-weight:700;font-size:13px}
.mut{color:var(--mut);font-size:13px}
.small{font-size:12px;color:var(--mut)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 11px;min-width:0;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.form{display:grid;grid-template-columns:1fr;gap:9px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:var(--ac);color:#fff;font-weight:650}
@media(prefers-color-scheme:dark){button{color:#06220f}}
button.ghost{background:transparent;color:var(--mut);padding:7px 10px;font-weight:600}
button.back{background:transparent;color:var(--ac);padding:4px 0;font-weight:600}
button:disabled{opacity:.55;cursor:wait}
.select-wrap{min-width:155px;max-width:220px}
.select-wrap label{display:block;color:var(--mut);font-size:12px;margin:0 0 4px}
.grade{text-align:right;flex:none}
.grade strong{font-size:25px;letter-spacing:-.5px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 10px}
.section-head h2{margin:0}
.category{padding:13px;border:1px solid var(--bd);border-radius:12px;margin-bottom:9px;background:var(--card)}
.category-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.weight{font-weight:750;color:var(--ac);white-space:nowrap}
.assignment{padding:10px 0;border-top:1px solid var(--bd);margin-top:10px}
.assignment:first-child{border-top:0;margin-top:0;padding-top:0}
.assignment:last-child{padding-bottom:0}
.assignment-grade{text-align:right;font-weight:650;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:24px 12px}
.status{border-radius:10px;background:var(--bg);padding:11px;color:var(--mut);font-size:13px}
.warn{color:var(--warn)}
.bad{color:var(--bad)}
.header-actions{display:flex;align-items:center;gap:9px;position:relative}
button.logout-btn{padding:9px 15px;border:1px solid rgba(74,222,128,.55);background:linear-gradient(135deg,#166534,#15803d);color:#f0fff4;box-shadow:0 0 0 1px rgba(74,222,128,.16),0 4px 18px rgba(34,197,94,.2);transition:transform .16s,box-shadow .16s}
button.logout-btn:hover{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(74,222,128,.3),0 0 19px rgba(34,197,94,.36)}
.account-dropdown{position:relative}
.account-dropdown summary{list-style:none;display:flex;align-items:center;gap:7px;cursor:pointer;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:13px;font-weight:650}
.account-dropdown summary::-webkit-details-marker{display:none}
.account-dropdown summary::after{content:'⌄';color:var(--mut);font-size:15px}
.account-dropdown[open] summary{border-color:var(--ac)}
.account-menu{position:absolute;z-index:30;right:0;top:calc(100% + 8px);width:min(290px,calc(100vw - 36px));padding:13px;border:1px solid var(--bd);border-radius:12px;background:var(--card);box-shadow:0 12px 32px rgba(0,0,0,.24)}
.account-menu strong{display:block;margin-top:5px;overflow-wrap:anywhere;font-size:13px}
.predict-area{margin:16px 0 20px}
button.predict-toggle{background:var(--acl);color:var(--ac);border:1px solid var(--ac);box-shadow:0 3px 14px rgba(34,197,94,.12)}
.predict-card{margin-top:10px}
.predict-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.predict-field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:650;color:var(--mut)}
.predict-field input,.predict-field select{font-weight:400}
.predict-result{margin-top:12px;padding:13px;border:1px solid var(--ac);border-radius:12px;background:var(--bg)}
.grade-change{font-size:clamp(20px,5vw,28px);font-weight:850;letter-spacing:-.5px;margin:5px 0}
.predict-help{margin-top:10px}
@media(max-width:520px){.predict-grid{grid-template-columns:1fr}.header-actions{gap:6px}.account-dropdown summary{padding:8px}.logout-btn{padding:8px 10px!important}}
@media(max-width:420px){.select-wrap{min-width:130px;max-width:160px}.big{font-size:38px}.card{padding:12px}}

main{max-width:1040px;padding:28px 22px 70px}
.login-shell{min-height:min(690px,calc(100vh - 90px));display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);align-items:stretch;gap:22px;margin:24px 0}
.login-hero{border:1px solid var(--bd);border-radius:24px;padding:clamp(25px,5vw,54px);background:radial-gradient(circle at 12% 10%,rgba(74,222,128,.2),transparent 42%),linear-gradient(145deg,var(--card),var(--bg));display:flex;flex-direction:column;justify-content:center;min-height:520px}
.login-mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--acl);color:var(--ac);font-size:30px;font-weight:900;margin-bottom:26px}
.login-hero h1{font-size:clamp(38px,5vw,56px);line-height:1.04;max-width:570px}
.login-hero .sub{font-size:18px;max-width:460px;margin:14px 0 26px}
.login-points{display:grid;gap:12px;margin-top:12px;color:var(--mut);font-size:14px}
.login-point{display:flex;align-items:center;gap:10px}.login-point span:first-child{width:27px;height:27px;display:grid;place-items:center;border-radius:9px;background:var(--acl);color:var(--ac);font-weight:800}
.login-panel{padding:clamp(22px,4vw,38px);border-radius:24px;box-shadow:0 18px 55px rgba(15,70,35,.10);display:flex;flex-direction:column;justify-content:center}
.login-panel h2{font-size:25px;margin:0 0 6px}.login-panel input{padding:14px 13px}.login-panel button{padding:14px 16px}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand-mark{display:flex;align-items:center;gap:11px}.brand-icon{width:42px;height:42px;border-radius:13px;background:var(--acl);color:var(--ac);display:grid;place-items:center;font-weight:900;font-size:22px}
.top-nav{display:flex;gap:7px;margin:21px 0 20px;padding:5px;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
.top-nav button{flex:1;background:transparent;color:var(--mut);padding:10px 14px;border-radius:10px;font-weight:700}
.top-nav button.active{background:var(--acl);color:var(--ac);box-shadow:inset 0 0 0 1px rgba(21,128,61,.18)}
.account-dropdown summary{padding:10px 13px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.06);gap:9px}
.account-avatar{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--acl);color:var(--ac);font-weight:850;font-size:12px}
.account-dropdown summary::after{content:'';width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin:-4px 3px 0 2px;transition:transform .16s}
.account-dropdown[open] summary::after{transform:rotate(225deg);margin-top:4px}
.account-menu{padding:12px;border-radius:16px}
.account-menu .menu-action{display:block;width:100%;text-align:left;margin-top:9px;padding:10px 11px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px}
.account-menu .menu-action:hover{border-color:var(--ac);background:var(--acl);color:var(--ac)}
.tab-intro{margin:6px 0 18px}.tab-intro h1{font-size:27px}.tab-intro p{margin:5px 0 0;color:var(--mut)}
.gpa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.gpa-card{padding:18px;border:1px solid var(--bd);border-radius:15px;background:var(--card)}
.gpa-card .gpa-value{font-size:36px;font-weight:850;line-height:1.1;letter-spacing:-1px;margin:8px 0 3px}
.gpa-period{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0 22px}
.gpa-course{display:grid;grid-template-columns:minmax(0,1fr) 150px 72px;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--bd)}
.gpa-course:first-child{border-top:0}.gpa-course select{padding:8px;font-size:13px}
.catalog-toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,240px);gap:10px;margin:14px 0}
.catalog-results{max-height:520px;overflow:auto;border:1px solid var(--bd);border-radius:14px;padding:7px;background:var(--bg)}
.catalog-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:11px;background:var(--card);margin:5px 0}
.catalog-item .course-meta{font-size:12px;color:var(--mut);margin-top:2px}
.catalog-item button{padding:8px 11px;white-space:nowrap;font-size:12px}
.catalog-item button.added{background:var(--acl);color:var(--ac);border:1px solid var(--ac)}
.selected-course{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--bd)}
.selected-course:first-child{border-top:0}
.eligibility{display:inline-flex;align-items:center;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:750;background:var(--bg);color:var(--mut);border:1px solid var(--bd);margin-top:6px}
.eligibility.good{color:#166534;background:#dcfce7;border-color:#86efac}.eligibility.progress{color:#92400e;background:#fef3c7;border-color:#fcd34d}.eligibility.review{color:#475569;background:#f1f5f9;border-color:#cbd5e1}.eligibility.no{color:var(--bad);background:rgba(198,40,40,.08);border-color:rgba(198,40,40,.25)}
.preference-editor{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.preference-editor select{max-width:190px}
.section-note{padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--mut);font-size:12px;margin-top:12px}
@media(max-width:760px){.login-shell{grid-template-columns:1fr;min-height:0}.login-hero{min-height:0;padding:28px}.login-hero h1{font-size:40px}.login-panel{padding:24px}.gpa-course{grid-template-columns:minmax(0,1fr) 130px}.gpa-course .credit-label{display:none}}
@media(max-width:520px){main{padding:17px 12px 52px}.header-row{align-items:flex-start}.brand-icon{width:36px;height:36px}.header-actions{gap:5px}.account-dropdown summary{font-size:12px;padding:8px}.top-nav{margin:16px 0;gap:3px}.top-nav button{padding:9px 7px;font-size:13px}.gpa-grid,.gpa-period{grid-template-columns:1fr 1fr}.gpa-card{padding:13px}.gpa-card .gpa-value{font-size:30px}.catalog-toolbar{grid-template-columns:1fr}.catalog-item{padding:10px}.catalog-item button{padding:8px}.login-hero .sub{font-size:16px}}

</style>
</head>

const PREF_KEY_PREFIX='gradeup_preferences_v1:';

let catalogCategory='All';

const getClass=id=>S.classes.find(course=>course.id===id);
const getPeriod=course=>course?.periods?.[S.selectedPeriod]||null;
// Genesis computes the course grade from category averages and category weights.
// The page's headline grade is rounded to a whole percent, so use the weighted
// category values whenever they are available to preserve the fractional grade.
function weightedCategoryGrade(data){
  const categories=(data?.categories||[]).filter(item=>Number.isFinite(Number(item.weight))&&Number(item.weight)>0&&item.average!==null&&item.average!==undefined&&Number.isFinite(Number(item.average)));
  const totalWeight=categories.reduce((sum,item)=>sum+Number(item.weight),0);
  if(totalWeight<=0)return null;
  return categories.reduce((sum,item)=>sum+Number(item.average)*Number(item.weight),0)/totalWeight;
}
const periodLabel=id=>S.markingPeriods.find(period=>period.id===id)?.label||`Marking Period ${String(id||'').replace(/^MP/i,'')}`;
const persist=()=>{try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(S));}catch{}}
function preferenceKey(account){return PREF_KEY_PREFIX+String(account||'').trim().toLowerCase();}
function loadPreferences(account){
  try{const raw=localStorage.getItem(preferenceKey(account));if(raw){const p=JSON.parse(raw);return {...PREFS,...p,selected:Array.isArray(p.selected)?p.selected:[],courseWeights:p.courseWeights||{}};}}catch{}
  return {nextGrade:'',selected:[],courseWeights:{},setupComplete:false};
}
function savePreferences(){try{localStorage.setItem(preferenceKey(S.account),JSON.stringify(PREFS));}catch{alert('Your browser could not save preferences. Check that local storage is enabled.');}}
function periodSelector(){
  return `<div class="select-wrap"><label for="periodSelect">Marking period</label><select id="periodSelect" onchange="changePeriod(this.value)">${S.markingPeriods.map(period=>`<option value="${esc(period.id)}" ${period.id===S.selectedPeriod?'selected':''}>${esc(period.label)}</option>`).join('')}</select></div>`;
}
function changePeriod(value){
  if(!S.markingPeriods.some(period=>period.id===value))return;
  S.selectedPeriod=value;lastPrediction=null;predictorOpen=false;persist();
  if(currentClassId)view();else home();
}

    html+=`<div class="card cls row" role="button" tabindex="0" onclick="openClass('${esc(course.id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openClass('${esc(course.id)}')}"><div class="grow"><b>${esc(course.name)}</b><div class="mut">${esc(secondary)}</div></div><div class="grade"><strong>${fmt(grade)}</strong>${grade!==null?`<div><span class="pill">${esc(letter(grade))}</span></div>`:''}</div></div>`;
  });
  html+=`<p class="small" style="margin-top:18px">Course information is read-only and comes from Genesis. GradeUp does not change grades, assignments, or category weights.</p>`;
  return html;
}

function normalizeCourseName(value){return String(value||'').toLowerCase().replace(/\b(ap|honors?|academic|advanced|college-level|college)\b/g,' ').replace(/\b(i|ii|iii|iv|v)\b/g,t=>({i:'1',ii:'2',iii:'3',iv:'4',v:'5'}[t]||t)).replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');}
function catalogMatchForCourse(course){
  const codeMatch=COURSE_CATALOG.find(item=>String(item.code)===String(course?.code||''));
  if(codeMatch)return codeMatch;
  const active=normalizeCourseName(course?.name);
  if(!active)return null;
  let best=null,bestScore=0;
  for(const item of COURSE_CATALOG){
    const target=normalizeCourseName(item.name);
    let score=0;
    if(active===target)score=1;
    else if(active.includes(target)||target.includes(active))score=Math.min(active.length,target.length)/Math.max(active.length,target.length)*.95;
    else{
      const a=new Set(active.split(' ').filter(x=>x.length>2));const b=new Set(target.split(' ').filter(x=>x.length>2));
      const common=[...a].filter(x=>b.has(x)).length;score=common/Math.max(a.size,b.size,1)*.85;
    }
    if(score>bestScore){bestScore=score;best=item;}
  }
  return bestScore>=.55?best:null;
}
function courseWeight(course){
  if(PREFS.courseWeights?.[course.id])return PREFS.courseWeights[course.id];
  const n=String(course.name||'').toLowerCase();
  if(/\bap\b|advanced placement/.test(n))return 'ap';
  if(/\bhonors?\b|\bhon\./.test(n))return 'honors';
  const match=catalogMatchForCourse(course);
  return match?.weight||'regular';
}
function setCourseWeight(id,value){PREFS.courseWeights=PREFS.courseWeights||{};PREFS.courseWeights[id]=value;savePreferences();gpaRefresh();}
function courseCredits(course){
  // SBHS PE/Driver Education split: Genesis reports these in different marking periods.
  const code=String(course?.code||'');
  const name=String(course?.name||'').toLowerCase();
  if(code==='H18020'||/driver'?s?\s*education/.test(name))return 1.5;
  if(/^H180(21|31|41)$/.test(code)||/physical education|\bpe\b/.test(name))return 3.5;
  const match=catalogMatchForCourse(course);return match?.credits||5;
}
function courseApplicablePeriods(course){
  const code=String(course?.code||'');
  const name=String(course?.name||'').toLowerCase();
  if(code==='H18020'||/driver'?s?\s*education/.test(name))return ['MP1'];
  if(/^H180(21|31|41)$/.test(code)||/physical education|\bpe\b/.test(name))return ['MP2','MP3','MP4'];
  return allPeriodIds();
}
const GPA_POINTS={'A':4,'A-':3.67,'B+':3.33,'B':3,'B-':2.67,'C+':2.33,'C':2,'C-':1.67,'D':1,'F':0};
function pointsForGrade(percent,weightType){
  const l=letter(percent);if(!l)return null;
  let points=GPA_POINTS[l];
  if(Number(percent)>=70){if(weightType==='honors')points+=.5;else if(weightType==='ap')points+=1;}
  return points;
}
function courseGradeForPeriod(course,periodId){
  if(!courseApplicablePeriods(course).includes(periodId))return null;
  const data=course?.periods?.[periodId];
  // Use the actual marking-period result. summaryGrade is a course-summary fallback,
  // not proof that the course has a grade in every marking period.
  const periodGrade=weightedCategoryGrade(data) ?? data?.grade;
  if(periodGrade!==null&&periodGrade!==undefined&&Number.isFinite(Number(periodGrade)))return Number(periodGrade);
  // Backward compatibility for older cached data that has no per-period payload at all.
  if(!course?.periods && periodId==='MP1' && course?.summaryGrade!==null && course?.summaryGrade!==undefined)return Number(course.summaryGrade);
  return null;
}
function allPeriodIds(){
  const ids=(S.markingPeriods||[]).map(x=>x.id).filter(id=>/^MP[1-4]$/i.test(id));
  return ['MP1','MP2','MP3','MP4'].filter(id=>ids.includes(id));
}
function courseGradeForYear(course){
  const ids=allPeriodIds().filter(id=>courseApplicablePeriods(course).includes(id));
  const vals=ids.map(id=>courseGradeForPeriod(course,id)).filter(v=>v!==null&&v!==undefined&&Number.isFinite(Number(v))).map(Number);
  return {grade:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null,count:vals.length,total:ids.length};
}
function calculateGpa(mode,weighted=false){
  let quality=0,credits=0,used=0,missing=0,partial=0,details=[];
  for(const course of S.classes){
    let grade,periodCount=1,totalPeriods=1;
    if(mode==='selected')grade=courseGradeForPeriod(course,S.selectedPeriod);
    else {const result=courseGradeForYear(course);grade=result.grade;periodCount=result.count;totalPeriods=result.total;if(result.count>0&&result.count<result.total)partial++;}
    if(grade===null||grade===undefined||!Number.isFinite(Number(grade))){missing++;continue;}
    const level=weighted?courseWeight(course):'regular';
    const credit=courseCredits(course);const points=pointsForGrade(Number(grade),level);
    if(points===null){missing++;continue;}
    quality+=points*credit;credits+=credit;used++;
    details.push({course,grade:Number(grade),points,credit,level,periodCount,totalPeriods});
  }
  return {gpa:credits?quality/credits:null,quality,credits,used,missing,partial,details};
}

function weightLabel(value){return value==='ap'?'AP / College-level':value==='honors'?'Honors':'Regular';}

function calculateWeighted(details){
  if(!details?.length)return null;
  let q=0,c=0;
  for(const row of details){const pts=pointsForGrade(row.grade,row.level);q+=pts*row.credit;c+=row.credit;}
  return c?q/c:null;
}
function gpaRefresh(){const app=$('#app');if(app&&S.loggedIn&&activeTab==='gpa')home();}
function gradeForActiveCourse(course){
  const val=courseGradeForPeriod(course,S.selectedPeriod);return val===null||val===undefined?null:Number(val);
}
function prereqCourseKey(value){
  let s=String(value||'').toLowerCase();
  s=s.replace(/\b(ap|honors?|advanced|academic)\b/g,' $1 ')
    .replace(/\b(ii|iii|iv|v|i)\b/g,t=>({i:'1',ii:'2',iii:'3',iv:'4',v:'5'}[t]||t))
    .replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
  // Common catalog abbreviations and Genesis naming variations.
  s=s.replace(/\badv algebra\b/g,'advanced algebra').replace(/\baa2\b/g,'advanced algebra 2')
    .replace(/\bha2\b/g,'honors algebra 2').replace(/\balgebra 2\b/g,'algebra 2')
    .replace(/\bus history honors\b/g,'honors us history').replace(/\bus history ap\b/g,'ap us history')
    .replace(/\bapush\b/g,'ap us history');
  return s;
}
function prerequisiteCourseMatches(prereq,activeName){
  const p=prereqCourseKey(prereq),a=prereqCourseKey(activeName);
  if(!p||!a)return false;
  return p===a;
}
function getEligibility(item){
  const next=Number(PREFS.nextGrade);
  if(item.grades.length&&next&&!item.grades.includes(next))return {label:`Not for grade ${next}`,cls:'no',detail:`Catalog lists this course for grade${item.grades.length>1?'s':''} ${item.grades.join(', ')}.`};
  if(item.prereq==='No prerequisites')return {label:'Eligible by catalog rules',cls:'good',detail:'The catalog lists no prerequisite for this course. Grade placement and counselor approval may still apply.'};

  // Evaluate each catalog alternative independently so a grade in one course
  // can never be compared with the threshold belonging to a different course.
  // The catalog uses both "or" and comma-separated shorthand alternatives
  // (for example: Algebra 2 >=93, AA2 >=73 or HA2 >=65). Split those
  // independently so each course keeps its own grade threshold.
  const clauses=String(item.prereq||'').replace(/\([^)]*\)/g,'')
    .split(/\s+or\s+|,\s*(?=(?:AA2|HA2|A1\+?|EG|MCLA)\b)/i);
  const parsed=clauses.map(clause=>{
    const m=clause.match(/(?:>=|>|at least\s*)\s*(\d{1,3})\s*%?|\b(\d{1,3})\s*%\s*(?:or better\s*)?(?:in\s*)?/i);
    if(!m)return {course:clause.trim(),threshold:null};
    const threshold=Number(m[1]||m[2]);
    const course=clause.replace(m[0],' ').replace(/\b(?:or better|or higher|minimum|required)\b/gi,' ').trim();
    return {course,threshold};
  });
  const matched=[];
  for(const rule of parsed){
    const c=S.classes.find(x=>prerequisiteCourseMatches(rule.course,x.name));
    if(c)matched.push({rule,course:c,grade:gradeForActiveCourse(c)});
  }
  if(matched.length){
    const passed=matched.find(x=>x.rule.threshold===null || (x.grade!==null&&Math.round(x.grade)>=x.rule.threshold));
    if(passed){
      const rounded=passed.grade===null?null:Math.round(passed.grade);
      const delta=passed.rule.threshold===null?null:rounded-passed.rule.threshold;
      return {label:'On track',cls:'good',detail:delta===null?`Currently taking ${passed.course.name}; the catalog lists this course as a prerequisite.`:`${passed.course.name}: ${fmt(passed.grade)}% (rounds to ${rounded}%) — meets the ${passed.rule.threshold}% requirement after district rounding. Keep working hard!`};
    }
    const closest=matched.sort((a,b)=>(b.grade??-1)-(a.grade??-1))[0];
    if(closest.grade!==null&&closest.rule.threshold!==null){
      const rounded=Math.round(closest.grade);
      const gap=closest.rule.threshold-rounded;
      return {label:gap<=1?'Almost there':'Off track',cls:'progress',detail:`${closest.course.name}: ${fmt(closest.grade)}% (rounds to ${rounded}%) — ${fmt(gap)} rounded percentage point${gap===1?'':'s'} below the ${closest.rule.threshold}% requirement. ${gap<=1?'Almost there!':`You need ${fmt(gap)} more rounded percentage point${gap===1?'':'s'}.`}`};
    }
    return {label:'In progress',cls:'progress',detail:`Currently taking ${matched[0].course.name}; the final course grade must be confirmed.`};
  }

  // Detect a course in the same subject but at the wrong level. For example,
  // regular Algebra II does not satisfy Advanced Algebra 2 or Honors Algebra 2.
  const levelSensitive=parsed.some(r=>/\b(?:advanced|honors|ap)\b/i.test(r.course));
  if(levelSensitive){
    const subjectWords=parsed.map(r=>prereqCourseKey(r.course).replace(/\b(?:advanced|honors|ap)\b/g,'').trim());
    const related=S.classes.find(c=>subjectWords.some(w=>w&&prereqCourseKey(c.name).replace(/\b(?:advanced|honors|ap)\b/g,'').trim()===w));
    if(related)return {label:'Not eligible by catalog rules',cls:'no',detail:`You're currently taking ${related.name}. The catalog requires ${parsed.map(r=>r.course).join(' or ')}; regular-level ${related.name} does not meet those course-level prerequisites.`};
  }
  return {label:'Needs review',cls:'review',detail:item.prereq==='Not specified in catalog'?'The catalog does not provide a clear prerequisite statement.':'GradeUp cannot verify prior completed courses, recommendations, placement, or other conditions from the current Genesis gradebook. '+item.prereq};
}

  const key=prereqCourseKey(activeName);
  if(!key)return false;
  const normalized=prereqCourseKey(prereq);
  return (` ${normalized} `).includes(` ${key} `);

function showPredictError(message){const box=$('#predictError');if(box){box.hidden=false;box.textContent=message;box.classList.add('bad');}}
function runPrediction(){
  const earnedRaw=$('#predictEarned')?.value;
  const possibleRaw=$('#predictPossible')?.value;
  const categoryName=$('#predictCategory')?.value;
  const earned=Number(earnedRaw);
  const possible=Number(possibleRaw);
  if(earnedRaw===''||possibleRaw===''||!categoryName){showPredictError('Enter the score, possible points, and category before predicting.');return;}
  if(!Number.isFinite(earned)||earned<0||!Number.isFinite(possible)||possible<=0||earned>possible){showPredictError('Enter a score from 0 through the possible points, and possible points greater than 0.');return;}
  const course=getClass(currentClassId);
  const data=getPeriod(course);
  const category=(data?.categories||[]).find(item=>item.name===categoryName);
  if(!course||!data||!category){showPredictError('The selected category is no longer available.');return;}
  const weight=Number(category.weight);
  if(!Number.isFinite(weight)||weight<=0){showPredictError('Genesis has not provided a usable weight for this category.');return;}

  const sameCategory=(data.assignments||[]).filter(item=>(item.category||'').trim().toLowerCase()===category.name.trim().toLowerCase());
  // Exempt and absent work does not count. Missing/incomplete work counts as
  // zero in Genesis, but without its possible points we cannot safely model it.
  const countedAssignments=sameCategory.filter(item=>!['E','A'].includes(String(item.status||'').toUpperCase()));
  const scored=countedAssignments.filter(item=>Number.isFinite(Number(item.earned))&&item.earned!==null&&Number.isFinite(Number(item.possible))&&item.possible>0);
  if(scored.length!==countedAssignments.length){showPredictError('This category has an assignment without readable earned/possible points (such as Missing or Incomplete). GradeUp cannot safely predict this category until Genesis provides those point totals.');return;}
  const totalEarned=scored.reduce((sum,item)=>sum+Number(item.earned),0);
  const totalPossible=scored.reduce((sum,item)=>sum+Number(item.possible),0);
  const oldCategoryAverage=category.average===null||category.average===undefined?null:Number(category.average);
  if(totalPossible>0&&oldCategoryAverage!==null){
    const pointsAverage=(totalEarned/totalPossible)*100;
    // Genesis displays category averages to one decimal place. A larger gap
    // means the visible assignments do not fully explain its category grade.
    if(Math.abs(pointsAverage-oldCategoryAverage)>0.15){showPredictError('Genesis’s category average does not match the readable assignment point totals, so a reliable prediction is not available for this category.');return;}
  }
  if(totalPossible===0&&countedAssignments.length>0){showPredictError('This category has assignments without readable point totals. GradeUp cannot safely estimate another assignment here.');return;}

  const newCategoryAverage=totalPossible>0?((totalEarned+earned)/(totalPossible+possible))*100:(earned/possible)*100;
  const gradedCategories=(data.categories||[]).filter(item=>Number(item.weight)>0&&item.average!==null&&item.average!==undefined&&Number.isFinite(Number(item.average)));
  const currentWeight=gradedCategories.reduce((sum,item)=>sum+Number(item.weight),0);
  const currentGrade=weightedCategoryGrade(data);
  if(currentWeight<=0||currentGrade===null){showPredictError('There is not enough category-average information to calculate a course-grade estimate.');return;}

  // Use the precise weighted category grade, not Genesis's rounded whole-number
  // headline. If this category has no current average, it joins the weighted
  // grade only after the pretend assignment is added.
  const categoryWasAlreadyWeighted=oldCategoryAverage!==null;
  const predictedGrade=categoryWasAlreadyWeighted
    ? currentGrade+(newCategoryAverage-oldCategoryAverage)*(weight/currentWeight)
    : (currentGrade*currentWeight+newCategoryAverage*weight)/(currentWeight+weight);
  const roundedPrediction=Math.round((predictedGrade+Number.EPSILON)*100)/100;
  lastPrediction={category:category.name,earned,possible,oldGrade:currentGrade,newGrade:roundedPrediction,oldCategoryAverage,newCategoryAverage,letter:letter(roundedPrediction)};
  view();
}

function assignmentGrade(assignment){
  if(assignment.earned!==null&&assignment.possible!==null){
    const score=`${fmtNumber(assignment.earned)} / ${fmtNumber(assignment.possible)}`;
    return assignment.percentage!==null?`${score} · ${fmt(assignment.percentage)}`:score;
  }
  if(assignment.status){
    const labels={M:'Missing · 0%',I:'Incomplete · 0%',E:'Exempt',A:'Absent'};
    return labels[assignment.status]||assignment.status;
  }
  return assignment.gradeText||'Not graded';
}
function renderAssignment(assignment){
  return `<div class="assignment row"><div class="grow"><b>${esc(assignment.name)}</b><div class="small">${esc(assignment.due||'')}</div></div><div class="assignment-grade">${esc(assignmentGrade(assignment))}</div></div>`;
}
function predictionMarkup(data){
  const categories=(data.categories||[]).filter(category=>Number(category.weight)>0);
  const options=categories.map(category=>`<option value="${esc(category.name)}">${esc(category.name)} · ${fmtNumber(category.weight)}% weight</option>`).join('');
  return `<div class="predict-area"><button type="button" class="predict-toggle" onclick="togglePredict()">${predictorOpen?'Close Predict':'Predict'}</button>${predictorOpen?`<div class="card predict-card"><b>Predict a new assignment</b><p class="small" style="margin:4px 0 0">Try a pretend score to estimate how it could affect this course. All three fields are required.</p><form onsubmit="event.preventDefault();runPrediction()"><div class="predict-grid"><label class="predict-field">Score earned<input id="predictEarned" type="number" min="0" step="any" placeholder="e.g. 89.9" required></label><label class="predict-field">Possible points<input id="predictPossible" type="number" min="0.01" step="any" placeholder="e.g. 100" required></label><label class="predict-field" style="grid-column:1/-1">Category<select id="predictCategory" required><option value="">Choose a category</option>${options}</select></label></div><button type="submit" ${categories.length?'':'disabled'}>Calculate prediction</button></form><div id="predictError" class="status" role="status" aria-live="polite" hidden style="margin-top:10px"></div>${lastPrediction?`<div class="predict-result"><div class="small">Pretend assignment added to ${esc(lastPrediction.category)}</div><div class="grade-change">${fmtPrediction(lastPrediction.oldGrade)} → ${fmtPrediction(lastPrediction.newGrade)}</div><div><b>Projected course grade: ${fmtPrediction(lastPrediction.newGrade)} (${esc(lastPrediction.letter)})</b></div><div class="small" style="margin-top:5px">Pretend score: ${fmtNumber(lastPrediction.earned)} / ${fmtNumber(lastPrediction.possible)} · Updated category average: ${fmt(lastPrediction.newCategoryAverage)}</div></div>`:''}<p class="small predict-help">This is an estimate using the category's Genesis weight and existing scored assignment points. It does not create an actual assignment, change Genesis, or save the prediction.</p></div>`:''}</div>`;
}

function view(){
  const course=getClass(currentClassId);
  if(!course){home();return;}
  const data=getPeriod(course);
  const grade=weightedCategoryGrade(data) ?? data?.grade ?? (S.selectedPeriod==='MP1'?course.summaryGrade:null);
  let html=`<div class="row" style="justify-content:space-between;align-items:center"><button class="back" onclick="switchTab('home')">← Home</button></div>
    <div class="row" style="justify-content:space-between;align-items:center;margin:9px 0 8px"><div class="grow"><h1>${esc(course.name)}</h1>${course.teacher?`<div class="mut">${esc(course.teacher)}</div>`:''}</div><div class="grade"><strong class="big">${fmt(grade)}</strong>${grade!==null?`<div><span class="pill">${esc(letter(grade))}</span></div>`:''}</div></div>
    <div class="row" style="justify-content:space-between;align-items:end;margin:18px 0 14px"><div><div class="small">Course information</div><b>${esc(periodLabel(S.selectedPeriod))}</b></div>${periodSelector()}</div>`;

  if(!data||data.unavailable){
    html+=`<div class="card empty">GradeUp couldn't retrieve this course for ${esc(periodLabel(S.selectedPeriod))}. Other marking periods may still be available.</div>`;
    $('#app').innerHTML=appHeader('home')+html;return;
  }

  html+=predictionMarkup(data);
  html+=`<div class="small" style="margin:0 0 8px">Grading categories · Read only</div>`;
  if(data.categories?.length){
    data.categories.forEach(category=>{
      const assignments=(data.assignments||[]).filter(assignment=>assignment.category.toLowerCase()===category.name.toLowerCase());
      html+=`<div class="category">
        <div class="category-top"><div class="grow"><b>${esc(category.name)}</b><div class="small">${assignments.length} assignments · Category average ${fmt(category.average)}</div></div><div class="weight">${fmtNumber(category.weight)}%</div></div>
        ${assignments.length?assignments.map(renderAssignment).join(''):'<div class="small" style="margin-top:9px">No assignments in this category for this marking period.</div>'}
      </div>`;
    });
    const knownNames=new Set(data.categories.map(category=>category.name.toLowerCase()));
    const uncategorized=(data.assignments||[]).filter(assignment=>!knownNames.has((assignment.category||'').toLowerCase()));
    if(uncategorized.length){
      html+=`<div class="category"><b>Other assignments</b>${uncategorized.map(renderAssignment).join('')}</div>`;
    }
  }else{
    html+=`<div class="card empty">Genesis did not provide category weights for this course and marking period.</div>`;
    if(data.assignments?.length){html+=`<h2>Assignments</h2><div class="card">${data.assignments.map(renderAssignment).join('')}</div>`;}
  }

  if(!data.categories?.length&&!data.assignments?.length){
    html+=`<div class="card empty">No assignments or category information has been posted for this marking period.</div>`;
  }
  if(data.lastPosted)html+=`<p class="small" style="margin-top:15px">Last grade posted: ${esc(data.lastPosted)}</p>`;
  html+=`<p class="small" style="margin-top:12px">Categories, weights, assignments, and scores are displayed as reported by Genesis. They cannot be edited in GradeUp.</p>`;
  $('#app').innerHTML=appHeader('home')+html;
}

const WORKER_URL='/api/sync';
async function syncGenesis(){
  const username=$('#gu')?.value.trim();
  const password=$('#gp')?.value;
  const output=$('#gs');
  const button=$('#loginButton');
  if(!username||!password){output.hidden=false;output.textContent='Enter your Genesis username and password.';return;}
  button.disabled=true;output.hidden=false;output.textContent='Signing in and scanning all classes and marking periods…';
  try{
    const response=await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      cache:'no-store',
      body:JSON.stringify({u:username,p:password})
    });
    const result=await response.json();
    $('#gp').value='';
    if(!response.ok||!result.success||!Array.isArray(result.classes)){
      output.textContent=result.error||'GradeUp could not sync Genesis. Please try again.';
      button.disabled=false;return;
    }
    S={
      loggedIn:true,
      account:username,
      classes:result.classes,
      markingPeriods:result.markingPeriods||[],
      selectedPeriod:(result.markingPeriods||[]).some(period=>period.id==='MP1')?'MP1':(result.markingPeriods||[])[0]?.id||'MP1'
    };
    PREFS=loadPreferences(username);
    activeTab=PREFS.setupComplete?'home':'goals';
    persist();home();
  }catch{
    $('#gp').value='';
    output.hidden=false;output.textContent='Could not reach GradeUp’s sync server. Check your connection and try again.';
    button.disabled=false;
  }
}

if(S.loggedIn){PREFS=loadPreferences(S.account);activeTab=PREFS.setupComplete?'home':'goals';}
home();
</script>
